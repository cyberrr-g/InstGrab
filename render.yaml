services:
  - type: web
    name: instgrab
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn igdownloader.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 600 --access-logfile - --error-logfile -
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: PYTHON_VERSION
        value: "3.14.8"
      - key: IG_SESSION_ID
        sync: false
      - key: IG_COOKIES
        sync: false
